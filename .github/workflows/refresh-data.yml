name: Refresh Data

# Weekly scrape -> load -> publish -> prod smoke test.
# Partial scraper failures are tolerated: loaders only replace tables whose
# curated JSON exists, so a failed portal leaves its previous data intact.
on:
  schedule:
    - cron: "30 21 * * 0" # Sundays 21:30 UTC = 03:00 IST Monday
  workflow_dispatch:
    inputs:
      schemes:
        # pmkisan restored to the weekly default 2026-08-06: the registered
        # DATA_GOV_IN_API_KEY (repo secret, verified account-wide) lifts the
        # demo-key 429 throttle that made its ~13M-row village-rollup pull
        # time out in CI (the reason it was removed at e19f780).
        description: "Comma-separated schemes to scrape (or 'all')"
        default: "all"
        required: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    # data.gov.in project key lifts the demo-key 429 throttle that made PM Kisan
    # + finance scrapers crawl in CI. Empty when the secret is unset — the
    # scrapers (via io_utils.datagov_api_key) then fall back to the public demo
    # key, so this is safe to wire before the secret exists.
    env:
      DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scrape (failures tolerated per scheme)
        continue-on-error: true
        run: |
          python run_all.py --schemes "${{ github.event.inputs.schemes || 'all' }}"

      - name: Refresh MLAs (MyNeta) and re-ingest politicians
        continue-on-error: true
        run: |
          python scrapers/scrape_mla_myneta.py --no-cache
          python -m constituency.ingest --mla-only
          python -m constituency.ingest --mp-only

      # Acceptance gate before anything loads: a scrape that reduced
      # granularity, coverage, or a money column (past its own guard) is
      # reverted to its last-good HEAD version so the clean schemes still
      # publish and prod keeps the prior data for the regressed one.
      - name: Verify refreshed curated data (revert regressions)
        run: python scripts/verify_refresh.py --revert-regressions

      - name: Load curated data into SQLite
        run: python run_all.py --load-only

      - name: Update district alias registry (additive) and reload
        run: |
          python scripts/gen_district_aliases.py
          python run_all.py --load-only --snapshot

      # Root-account evidence is fail-closed: a changed value, row set,
      # source, or retrieval time requires paired review of DATA_CLAIMS.md and
      # the explicit contract digests before any commit or publish.
      - name: Verify public claim bindings
        run: python scripts/verify_public_claims.py

      # Commit BEFORE publishing: the 2026-08-05 babysit run failed inside
      # sync_turso AFTER all tables had pushed, and the skipped commit left
      # prod serving data no git commit described. Curated-in-git is the
      # source of truth — land it first, then publish from it; a publish
      # failure then means "git ahead of prod", which any later sync heals.
      - name: Commit refreshed curated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/curated data/catalog db/district_aliases.py DATA_CLAIMS.md || true
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: scheduled data refresh [skip ci]"
            # The scrape runs for an hour+; main may have moved since checkout.
            # Rebase our single data commit instead of failing the push.
            git pull --rebase origin main
            git push
          fi

      - name: Publish to Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python scripts/sync_turso.py

      - name: Smoke test production
        run: |
          set -e
          for ep in "api/v1/pin/600001" "api/v1/stats" "api/v1/scores/worst?n=1" "api/v1/freshness"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://hisaab-one.vercel.app/$ep")
            echo "$code /$ep"
            [ "$code" = "200" ] || exit 1
          done
